<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Étoiles jaune doré -->
  <circle cx="8" cy="10" r="1.5" fill="#fde68a" opacity="0.95"/>
  <circle cx="55" cy="8" r="1" fill="#fbbf24" opacity="0.9"/>
  <circle cx="12" cy="50" r="1" fill="#fde68a" opacity="0.8"/>
  <circle cx="58" cy="45" r="1.5" fill="#fbbf24" opacity="0.95"/>
  <circle cx="48" cy="16" r="1" fill="#fde68a" opacity="0.7"/>
  <circle cx="5" cy="30" r="1" fill="#fbbf24" opacity="0.85"/>
  <circle cx="60" cy="28" r="1" fill="#fde68a" opacity="0.8"/>
  <circle cx="20" cy="57" r="1" fill="#fbbf24" opacity="0.7"/>
  <circle cx="43" cy="55" r="1.5" fill="#fde68a" opacity="0.9"/>

  <!-- Anneau derrière la planète -->
  <ellipse cx="32" cy="34" rx="22" ry="6"
    fill="none" stroke="#f59e0b" stroke-width="3.5" opacity="0.85"
    transform="rotate(-20, 32, 34)"
    stroke-dasharray="34 34"
    stroke-dashoffset="0"/>

  <defs>
    <clipPath id="planetClip">
      <circle cx="32" cy="32" r="16"/>
    </clipPath>
    <radialGradient id="baseGrad" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e4f60"/>
    </radialGradient>
  </defs>

  <!-- Base planète -->
  <circle cx="32" cy="32" r="16" fill="url(#baseGrad)"/>

  <!-- Bandes de texture (clippées à la sphère) -->
  <g clip-path="url(#planetClip)">
    <!-- Bande sombre centrale -->
    <ellipse cx="32" cy="32" rx="17" ry="4" fill="#065f76" opacity="0.55"/>
    <!-- Bande claire haute -->
    <ellipse cx="30" cy="24" rx="15" ry="3" fill="#22d3ee" opacity="0.35"/>
    <!-- Bande claire basse -->
    <ellipse cx="34" cy="40" rx="14" ry="2.5" fill="#0e7490" opacity="0.4"/>
    <!-- Petite tache (style tempête) -->
    <ellipse cx="37" cy="30" rx="4" ry="2.5" fill="#0e7490" opacity="0.55" transform="rotate(-10, 37, 30)"/>
    <!-- Ombre bord droit -->
    <circle cx="32" cy="32" r="16" fill="#03333d" opacity="0.25"
      transform="translate(8, 4)"/>
  </g>

  <!-- Anneau devant la planète -->
  <ellipse cx="32" cy="34" rx="22" ry="6"
    fill="none" stroke="#fcd34d" stroke-width="3.5" opacity="0.85"
    transform="rotate(-20, 32, 34)"
    stroke-dasharray="34 34"
    stroke-dashoffset="34"/>
</svg>
