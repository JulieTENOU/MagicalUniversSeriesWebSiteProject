#version: '4.0'

services:
  db:
    image: mysql
    container_name: dbMA
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - /data/docker/mus-db:/var/lib/mysql
    restart: always
    # Healthcheck : back ne démarre qu'une fois MySQL réellement prêt (évite PROTOCOL_CONNECTION_LOST au boot)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mu-network

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - mu-network

  back:
    build: ./back
    container_name: backMA
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
    env_file:
      - ./.env
      - ./back/.env
    volumes:
      - ./back:/app
      - /app/node_modules
      - /var/www/mus_storage:/var/www/mus_storage
    # Ancien depends_on (insuffisant : attend le démarrage du conteneur, pas que MySQL soit ready)
    # depends_on:
    #   - db
    # Attend que MySQL soit réellement prêt (healthcheck) avant de démarrer
    depends_on:
      db:
        condition: service_healthy
    # Redémarre automatiquement si le backend crashe
    restart: unless-stopped
    networks:
      - mu-network

  #   front:
  #     build: ./front
  #     container_name: frontMA
  #     ports:
  #       - "3003:3003"
  # #    volumes:
  # #      - ./front:/app
  #     depends_on:
  #       - back
  #     networks:
  #       - mu-network

  nginx:
    build: ./front
    depends_on:
      - back
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped
    networks:
      - mu-network
      - proxy-network

networks:
  mu-network:
  proxy-network:
    external: true
